name: Preview package release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      destination:
        description: Build only, or publish a version tag after configuring Trusted Publishing
        type: choice
        options: [build-only, testpypi, pypi]
        default: build-only

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: python -m pip install '.[dev,release]'
      - name: Require version tag for publication
        env:
          DESTINATION: ${{ inputs.destination }}
          EVENT_NAME: ${{ github.event_name }}
        shell: python
        run: |
          import os
          from libidentifier import __version__
          if os.environ['EVENT_NAME'] == 'release' or os.environ['DESTINATION'] != 'build-only':
              assert os.environ['GITHUB_REF_TYPE'] == 'tag', 'Select the version tag when publishing'
              assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__, 'Tag/package version mismatch'
      - name: Require successful platform qualification before publishing
        if: github.event_name == 'release' || inputs.destination != 'build-only'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          endpoint = (os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
              + '/actions/workflows/tests.yml/runs?head_sha=' + os.environ['GITHUB_SHA']
              + '&status=success&per_page=1')
          request = urllib.request.Request(endpoint, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response)['workflow_runs']
          assert runs, 'Tests workflow must succeed for this exact commit before publication'
      - name: Run portable regressions
        run: python -m pytest -q -ra
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          python tools/check_distributions.py dist
      - name: Verify sdist can rebuild the wheel
        shell: bash
        run: |
          mkdir rebuilt
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir rebuilt
          python tools/check_distributions.py rebuilt
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/.release-venv/bin/libidentifier" --help
          "$GITHUB_WORKSPACE/.release-venv/bin/python" -c 'from libidentifier import install_profiles, package_profiles, identify, scan, correlate; print("public imports passed")'
      - uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.destination == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release' || inputs.destination == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
