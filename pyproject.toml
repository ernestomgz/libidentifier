[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "libidentifier"
version = "0.1.0"
description = "Offline identification of compiled Android and native libraries from local fingerprints"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "LibIdentifier authors"}]
dependencies = ["lief==0.17.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
libidentifier = "libidentifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

